server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 256KB

spring:
  application:
    name: saga-log-explorer
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

logexplorer:
  # مسیر فایل تفسیر لاگ. با -Dlogexplorer.config=/etc/log-viewer/config.yaml قابل تغییر است.
  config: config/config.yaml
  # مسیر فایل برچسب‌های فارسی و تنظیمات نمایش
  labels: config/config.json
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

  admin:
    # توکن صفحهٔ مدیریتی. خالی یعنی API مدیریتی کاملاً غیرفعال است (fail-closed).
    # هرگز اینجا مقدار ثابت نگذارید؛ از متغیر محیطی بدهید:
    #   ADMIN_TOKEN=$(openssl rand -hex 24)
    # حداقل ۱۶ نویسه، وگرنه پذیرفته نمی‌شود.
    token: ${ADMIN_TOKEN:}
    # تاریخچهٔ تغییرات پیکربندی — فقط-افزودنی، قالب JSONL
    audit-file: ${ADMIN_AUDIT_FILE:data/admin-audit.log}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.citydi.logexplorer: INFO
    org.mongodb.driver: WARN
