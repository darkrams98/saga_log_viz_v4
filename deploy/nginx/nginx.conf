# =====================================================================
#  nginx — سرو فرانت‌اند + پروکسی API + محافظت مسیر مدیریتی
# =====================================================================
#  این فایل هم در Docker استفاده می‌شود و هم روی سرور مستقل.
#  در حالت مستقل، بلوک TLS پایین را از کامنت دربیاورید.
# =====================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------ امنیت
    # این هدرها ارزان‌اند و چند کلاس حمله را حذف می‌کنند.
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header Referrer-Policy         "same-origin"      always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

    # سیاست محتوا: برنامه هیچ منبع خارجی‌ای بار نمی‌کند (فونت هم محلی است)،
    # پس می‌شود سخت‌گیرانه بست.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    server_tokens off;
    client_max_body_size 4m;

    # ------------------------------------------------------- فایل‌های ایستا
    # دارایی‌های hash‌دار تا ابد cache می‌شوند؛ index.html هرگز.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---------------------------------------------------------- مسیر مدیریتی
    #
    # لایهٔ دوم دفاع. توکن در خود برنامه بررسی می‌شود، ولی محدودکردن
    # شبکه یعنی حتی *رسیدن* به آن صفحه هم از بیرون ممکن نباشد.
    #
    # فهرست را با شبکهٔ داخلی خودتان جایگزین کنید.
    location /api/v1/admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        # کندسازی تلاش‌های ورود، پیش از رسیدن به برنامه
        limit_req zone=admin burst=10 nodelay;

        # اگر احراز هویت سازمانی دارید، نام کاربر را به برنامه بدهید
        # تا در تاریخچهٔ تغییرات ثبت شود (به‌جای «admin-token»):
        # auth_request /auth;
        # auth_request_set $user $upstream_http_x_forwarded_user;
        # proxy_set_header X-Forwarded-User $user;

        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params_logviewer.conf;
    }

    # ------------------------------------------------------------- API
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params_logviewer.conf;

        # جستجوی پیشرفته می‌تواند تا سقف maxTimeMs طول بکشد؛
        # مهلت پروکسی باید کمی بیشتر باشد وگرنه ۵۰۴ می‌دهد.
        proxy_read_timeout 60s;
    }

    # actuator فقط از شبکهٔ داخلی — برای پایش، نه برای عموم
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params_logviewer.conf;
    }

    # -------------------------------------------------------- مسیریابی SPA
    # برنامه مسیرهای سمت کلاینت دارد (/log/:id و /admin/:tab)، پس هر مسیر
    # ناشناخته باید به index.html برسد، نه ۴۰۴.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

