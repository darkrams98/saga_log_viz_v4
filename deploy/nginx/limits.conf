# در بلوک http قرار می‌گیرد (نه داخل server).
# در Docker به‌صورت /etc/nginx/conf.d/00-limits.conf کپی می‌شود.
#
# نرخ‌ها محافظه‌کارانه‌اند: این سرویس ابزار پشتیبانی است، نه API عمومی.
# ۵ درخواست در ثانیه برای هر IP، برای کار انسانی کاملاً کافی است.
limit_req_zone $binary_remote_addr zone=api:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin:5m  rate=1r/s;
limit_req_status 429;
